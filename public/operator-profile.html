<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>Travel Operator · YATRIO</title><link rel="stylesheet" href="/yatrio-motion.css"><link rel="stylesheet" href="/yatrio-visuals.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:#173247;font-family:Inter,Arial,sans-serif}.top{padding:18px max(5%,calc((100% - 1120px)/2));background:#102a43;color:#fff;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:850;letter-spacing:.04em}.brand b{background:#18a999;border-radius:8px;padding:6px 9px;margin-right:8px}.top a{color:#d7e8ee;text-decoration:none}.wrap{max-width:1120px;margin:30px auto;padding:0 20px}.hero{position:relative;overflow:hidden;border-radius:24px;padding:clamp(26px,5vw,54px);background:linear-gradient(115deg,#102a43f2,#164e63e8),url('/images/pokhara.jpg') center/cover;color:#fff;box-shadow:0 18px 48px #102a4322}.eyebrow{color:#8ee0d1;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.hero h1{font-size:clamp(30px,5vw,48px);margin:12px 0}.hero p{max-width:720px;color:#d9e8ee;line-height:1.7}.verified{display:inline-flex;align-items:center;gap:7px;border:1px solid #69d7b4;border-radius:30px;padding:8px 12px;color:#b5f3dc;font-size:13px;font-weight:700}.section{margin:28px 0}.section h2{font-size:24px}.muted{color:#708394;line-height:1.65}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.stat,.bus{background:#fff;border:1px solid #e1eaf0;border-radius:16px;padding:18px}.stat strong{font-size:24px;display:block}.busgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.bus h3{margin:0 0 7px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.tag{background:#eaf5f2;color:#176e63;border-radius:20px;padding:6px 9px;font-size:12px}.gallery{display:flex;gap:9px;overflow:auto;margin:14px 0}.gallery img{width:190px;height:120px;object-fit:cover;border-radius:11px}.route{display:inline-block;margin:5px;padding:8px 11px;border:1px solid #dbe7ec;border-radius:20px;background:#fff;font-size:13px}.contact{display:inline-block;background:#18a999;color:#fff;text-decoration:none;padding:12px 17px;border-radius:10px;font-weight:700}.notice{padding:18px;background:#fff;border:1px solid #e1eaf0;border-radius:14px}.foot{padding:30px 0;color:#748797;font-size:13px}@media(max-width:680px){.busgrid,.stats{grid-template-columns:1fr}.top{padding:16px 20px}.hero{border-radius:18px}}
</style></head><body><header class="top"><div class="brand"><b>Y</b>YATRIO</div><a href="/">← Find journeys</a></header><main class="wrap"><div id="content" class="notice">Loading operator profile…</div><footer class="foot">YATRIO — One platform. Every journey. · Operator information is supplied by the operator and verification is based on documents reviewed by YATRIO.</footer></main><script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const amenityNames={ac:"Air conditioning",wifi:"Wi-Fi",charging:"Charging points",water:"Drinking water",blanket:"Blanket",reclining_seats:"Reclining seats",toilet:"Onboard toilet"};
async function load(){const slug=new URLSearchParams(location.search).get("slug")||"";const box=document.getElementById("content");try{const r=await fetch("/api/operator-profile?slug="+encodeURIComponent(slug));const d=await r.json();if(!r.ok)throw new Error(d.error||"Profile unavailable");const o=d.operator;document.title=o.name+" · YATRIO";box.className="";box.innerHTML='<section class="hero"><span class="eyebrow">YATRIO TRAVEL PARTNER</span><h1>'+esc(o.name)+'</h1>'+(o.verified?'<span class="verified">✓ YATRIO document-verified operator</span>':'<span class="verified">Partner profile</span>')+'<p>'+esc(o.description||"Travel services and departures listed on YATRIO.")+'</p>'+(o.phone?'<a class="contact" href="tel:'+esc(o.phone)+'">Contact operator</a>':'')+'<div class="stats"><div class="stat"><strong>'+d.buses.length+'</strong><span class="muted">Active buses</span></div><div class="stat"><strong>'+d.routes.length+'</strong><span class="muted">Listed routes</span></div><div class="stat"><strong>'+(o.verified?'4/4':'Pending')+'</strong><span class="muted">Verification documents</span></div></div></section><section class="section"><h2>Fleet & onboard amenities</h2><p class="muted">Amenities are declared by the operator. Confirm specific facilities before travel.</p><div class="busgrid">'+(d.buses.length?d.buses.map(b=>'<article class="bus"><h3>'+esc(b.name)+'</h3><div class="muted">'+esc(b.bus_type)+' · '+esc(b.capacity)+' seats · '+esc(b.upcoming_departures)+' upcoming departures</div><div class="tags">'+(b.amenities.length?b.amenities.map(a=>'<span class="tag">'+esc(amenityNames[a]||a)+'</span>').join(""):'<span class="muted">No amenities listed by operator yet.</span>')+'</div>'+(b.images.length?'<div class="gallery">'+b.images.map(i=>'<img src="'+esc(i.url)+'" alt="'+esc(i.alt_text||i.type)+'" loading="lazy">').join("")+'</div>':'<div class="gallery"><img src="/images/fleet-demo-exterior.jpg" alt="Illustrative coach exterior example"><img src="/images/fleet-demo-interior.jpg" alt="Illustrative coach interior example"></div><p class="muted">Illustrative fleet examples only — not photographs of this operator’s vehicles. Actual fleet photos appear after operator upload and YATRIO approval.</p>')+'</article>').join(""):'<p class="notice">No active buses are currently listed.</p>')+'</div></section><section class="section"><h2>Passenger reviews</h2><p class="muted">Only published reviews from completed journeys are shown.</p><div class="notice"><strong>'+esc(d.average_rating||"—")+' / 5</strong> · '+esc(d.review_count)+' published reviews</div>'+(d.reviews&&d.reviews.length?d.reviews.map(r=>'<article class="bus" style="margin:12px 0"><div class="tags"><span class="tag">'+("★".repeat(r.rating))+("☆".repeat(5-r.rating))+'</span></div><h3>'+esc(r.title||"Verified passenger review")+'</h3><p class="muted">'+esc(r.body)+'</p><small class="muted">Verified journey · '+esc(new Date(r.created_at).toLocaleDateString())+'</small></article>').join(""):'<p class="muted">No published passenger reviews yet.</p>')+'</section><section class="section"><h2>Routes served</h2>'+(d.routes.length?d.routes.map(x=>'<span class="route">'+esc(x.origin)+' → '+esc(x.destination)+'</span>').join(""):'<p class="muted">No upcoming departures are currently published.</p>')+'</section><p class="muted">This is a partner information page, not a ticket confirmation. Sample listings may be used while YATRIO is in MVP testing.</p>';}catch(e){box.innerHTML='<h2>Operator profile unavailable</h2><p class="muted">'+esc(e.message)+'</p><a href="/">Return to YATRIO</a>'}}
load();
</script></body></html>
