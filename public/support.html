<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>YATRIO Support Centre</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f8f9;color:#183247;font-family:Inter,Arial,sans-serif}a{color:#168a7d;text-decoration:none}.top{background:#102a43;color:#fff;padding:18px max(20px,calc((100% - 920px)/2));display:flex;justify-content:space-between}.top a{color:#cce6e1}.wrap{max-width:920px;margin:auto;padding:24px 20px}.hero h1{margin:0 0 7px}.muted{font-size:13px;color:#6c8190;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.panel{background:white;border:1px solid #e1eaf0;border-radius:15px;padding:18px;min-width:0}label{display:block;font-size:12px;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid #dce6eb;border-radius:9px;padding:11px;font:inherit}textarea{min-height:110px;resize:vertical}.btn{border:0;background:#18a999;color:white;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;margin-top:12px}.ticket{padding:12px;border:1px solid #e6edf1;border-radius:10px;margin-top:8px;cursor:pointer}.ticket.active{border-color:#18a999;background:#f0faf7}.ticket b{display:block;font-size:13px}.ticket small{color:#718492;font-size:11px}.messages{display:grid;gap:9px;margin-top:14px}.msg{padding:11px;border-radius:10px;background:#eff4f6;font-size:13px;line-height:1.5}.msg.admin{background:#e1f5ef}.empty{padding:20px;color:#718492;text-align:center;font-size:13px}.status{font-size:12px;margin-top:10px;color:#168a7d}@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:16px}}
</style></head><body><header class="top"><b>YATRIO SUPPORT</b><a href="/traveller-dashboard.html">← Dashboard</a></header><main class="wrap"><section class="hero"><h1>How can we help?</h1><p class="muted">Create a support request for a booking, payment status, account or travel service. You can reply here and track the response.</p></section><div class="grid"><section class="panel"><h2>New support request</h2><form id="create"><label>Subject</label><input id="subject" maxlength="140" minlength="4" required placeholder="Briefly describe the issue"><label>Category</label><select id="category"><option value="general">General question</option><option value="booking">Booking help</option><option value="payment">Payment status</option><option value="cancellation">Cancellation</option><option value="account">Account access</option><option value="provider">Operator / provider</option></select><label>Booking type (optional)</label><select id="type"><option value="">Not booking-related</option><option value="bus">Bus booking</option><option value="marketplace">Stay / experience booking</option></select><label>Booking ID (optional)</label><input id="booking" placeholder="Paste booking ID only when linking a booking"><label>Message</label><textarea id="first" minlength="5" maxlength="3000" required placeholder="Explain what happened and what help you need."></textarea><button class="btn">Create support ticket</button></form><div id="createStatus" class="status"></div></section><section class="panel"><h2>Your support tickets</h2><div id="tickets"><div class="empty">Loading tickets…</div></div><div id="ticketView"></div></section></div></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opts){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json'}}),d=await r.json().catch(()=>({}));if(r.status===401){location.href='/login.html?next='+encodeURIComponent('/support.html');throw Error('Please sign in')}if(!r.ok)throw Error(d.error||'Request failed');return d}
let active='';async function load(){const d=await api('/api/support-tickets');$('tickets').innerHTML=d.tickets.length?d.tickets.map(t=>'<button class="ticket '+(t.id===active?'active':'')+'" data-id="'+t.id+'"><b>'+esc(t.subject)+'</b><small>'+esc(t.status)+' · '+esc(t.priority)+' · '+new Date(t.updated_at).toLocaleString()+'</small></button>').join(''):'<div class="empty">No support tickets yet.</div>';$('tickets').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(b.dataset.id))}
async function open(id){active=id;const d=await api('/api/support-tickets?ticket_id='+id);$('ticketView').innerHTML='<hr><h3>'+esc(d.ticket.subject)+'</h3><p class="muted">'+esc(d.ticket.status)+' · '+esc(d.ticket.category)+'</p><div class="messages">'+d.messages.map(m=>'<div class="msg '+(m.sender_role==='admin'?'admin':'')+'"><b>'+esc(m.sender_role)+'</b><br>'+esc(m.body)+'<small class="muted"><br>'+new Date(m.created_at).toLocaleString()+'</small></div>').join('')+'</div>'+(d.ticket.status!=='resolved'?'<form id="reply"><label>Reply</label><textarea id="replyBody" maxlength="3000" required></textarea><button class="btn">Send reply</button></form>':'<p class="muted">This ticket is resolved. Create a new ticket if you need more help.</p>');if($('reply'))$('reply').onsubmit=async e=>{e.preventDefault();try{await api('/api/support-tickets',{method:'POST',body:JSON.stringify({action:'reply',ticket_id:id,body:$('replyBody').value})});await open(id);await load()}catch(err){alert(err.message)}};await loadButtons()}
async function loadButtons(){document.querySelectorAll('.ticket').forEach(b=>b.classList.toggle('active',b.dataset.id===active))}
$('create').onsubmit=async e=>{e.preventDefault();try{const type=$('type').value,id=$('booking').value.trim();const d=await api('/api/support-tickets',{method:'POST',body:JSON.stringify({action:'create',subject:$('subject').value,category:$('category').value,body:$('first').value,booking_type:type||undefined,booking_id:id||undefined})});$('createStatus').textContent='Ticket created: '+d.ticket.id;e.target.reset();await load();await open(d.ticket.id)}catch(err){$('createStatus').textContent=err.message}};(async()=>{try{await load()}catch(e){$('tickets').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}})();
</script></body></html>
