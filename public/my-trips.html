eader class="top"><div class="brand">YATRIO</div><a href="/">← Find journeys</a></header><main class="wrap"><h1>My trips & reviews</h1><p class="muted">Reviews unlock only after your operator marks a paid or confirmed journey as completed. Each completed booking can receive one review.</p><section id="journeys" class="grid"><div class="empty">Checking your journeys…</div></section><p id="notice" class="muted"></p></main><script>
