<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in · Yatrio</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#102a43,#147d7a);font-family:Arial,sans-serif;color:#172b3a}.card{width:min(420px,calc(100% - 32px));background:white;border-radius:22px;padding:34px;box-shadow:0 20px 70px #06182755}.brand{font-size:26px;font-weight:800;color:#102a43;letter-spacing:-1px}.mark{display:inline-grid;place-items:center;background:#18a999;color:white;width:34px;height:34px;border-radius:11px;margin-right:8px}.sub{color:#718096;line-height:1.6;font-size:14px;margin:12px 0 24px}input,button{width:100%;height:48px;border-radius:10px;font:inherit}input{border:1px solid #dce5ea;padding:0 14px;margin-bottom:10px}button{border:0;background:#18a999;color:white;font-weight:700;cursor:pointer;margin-top:8px}button.alt{background:white;border:1px solid #dce5ea;color:#526777}button:disabled{opacity:.5}.msg{font-size:13px;color:#718096;min-height:20px;margin-top:16px}.msg.err{color:#b42318}[hidden]{display:none!important}</style><link rel="stylesheet" href="/yatrio-motion.css"><link rel="stylesheet" href="/yatrio-visuals.css"></head><body class="yatrio-motion yatrio-login"><main class="card"><div class="brand"><span class="mark">Y</span>yatrio</div><p class="sub" id="sub">Sign in or create your account using a one-time email code. No password required.</p><form id="form"><input id="email" type="email" placeholder="Email address" autocomplete="username webauthn" required><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" hidden><button id="submit">Continue</button><button id="back" type="button" class="alt" hidden>Change email</button></form><section id="passkey" hidden><p class="sub">Add a passkey for faster sign-in next time.</p><button id="add">Add passkey</button><button id="skip" class="alt">Not now</button></section><p id="msg" class="msg" role="status"></p></main><script>
(function(){const A=window.hatchable&&window.hatchable.auth;const $=id=>document.getElementById(id);let step="email",hasPasskey=false;const next=(()=>{const n=new URLSearchParams(location.search).get("next")||"/";return n.startsWith("/")&&!n.startsWith("//")&&!n.includes("\\\\")?n:"/";})();function say(t,err){$("msg").textContent=t||"";$("msg").className="msg"+(err?" err":"")}function go(){location.replace(next)}if(!A){say("Sign-in is unavailable. Refresh and try again.",true);return}A.getSession().then(s=>{if(s&&s.user)go()});$("form").onsubmit=async e=>{e.preventDefault();$("submit").disabled=true;try{if(step==="email"){const r=await A.startLogin({email:$("email").value.trim()});hasPasskey=!!r.has_passkey;if(hasPasskey&&A.supportsPasskeys()){try{const p=await A.signInWithPasskey({email:$("email").value.trim()});if(p&&p.user){go();return}}catch(e){}}step="code";$("code").hidden=false;$("back").hidden=false;$("submit").textContent="Verify code";$("sub").textContent="Enter the one-time code sent to your email.";say("Code sent.");$("code").focus()}else{await A.verifyCode({email:$("email").value.trim(),code:$("code").value.trim()});if(!hasPasskey&&A.supportsPasskeys()&&localStorage.getItem("yatrio_passkey_declined")!=="1"){$("form").hidden=true;$("passkey").hidden=false;$("sub").textContent="You're signed in."}else go()}}catch(err){say(err.message||"Could not sign in. Try again.",true)}finally{$("submit").disabled=false}};$("back").onclick=()=>{step="email";$("code").hidden=true;$("back").hidden=true;$("submit").textContent="Continue";say("")};$("add").onclick=async()=>{try{await A.registerPasskey()}catch(e){}go()};$("skip").onclick=()=>{localStorage.setItem("yatrio_passkey_declined","1");go()}})();
</script><script src="/yatrio-motion.js" defer></script></body></html>
