<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operator Verification · Yatrio</title><style>body{margin:0;background:#f4f7f9;color:#172b3a;font-family:Arial,sans-serif}.top{background:#102a43;color:#fff;padding:20px 5%;font-size:22px;font-weight:800}.wrap{max-width:1050px;margin:35px auto;padding:0 20px}.card{background:white;border:1px solid #e1e9ee;border-radius:15px;padding:22px;margin:15px 0}.muted{color:#718096;font-size:14px}.item{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:15px 0;border-bottom:1px solid #edf1f4}.btn{border:0;border-radius:8px;padding:10px 13px;background:#18a999;color:white;font-weight:700;cursor:pointer}.btn.no{background:#b42318}.btn.gray{background:#64748b}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-size:12px;padding:5px 9px;border-radius:20px;background:#fff3d7;color:#805d16}</style><link rel="stylesheet" href="/yatrio-motion.css"><link rel="stylesheet" href="/yatrio-motion.css"></head><body><header class="top">YATRIO · OPERATOR VERIFICATION</header><main class="wrap"><h1>Operator applications</h1><p class="muted">Restricted administration area. Review submitted operator details and approve only after independently verifying their business registration and operating authorization.</p><div id="message" class="muted"></div><section class="card"><div id="list">Loading applications…</div></section></main><script>
async function load(){const e=document.getElementById('list');try{const r=await fetch('/api/admin-operators');const d=await r.json();if(!r.ok)throw new Error(d.error||'Access denied');if(!d.operators.length){e.textContent='No operator applications yet.';return}e.innerHTML=d.operators.map(o=>'<div class="item"><div><strong>'+o.name+'</strong><div class="muted">'+o.phone+' · '+o.description+'</div><span class="status">'+o.status+'</span></div><div class="actions">'+(o.status==='pending'?'<button class="btn" onclick="review(\''+o.id+'\',\'approved\')">Approve</button><button class="btn no" onclick="review(\''+o.id+'\',\'rejected\')">Reject</button>':'<button class="btn gray" onclick="review(\''+o.id+'\',\'suspended\')">Suspend</button>')+'</div></div>').join('')}catch(err){e.textContent=err.message+' — sign in as a Yatrio project administrator.'}}
async function review(id,status){if(!confirm('Change this operator status to '+status+'?'))return;try{const r=await fetch('/api/admin-operators',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operator_id:id,status})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Update failed');document.getElementById('message').textContent='Updated '+d.operator.name+' to '+d.operator.status;load()}catch(e){document.getElementById('message').textContent=e.message}}
load();
</script><script src="/yatrio-motion.js" defer></script><script src="/yatrio-motion.js" defer></script></body></html>
