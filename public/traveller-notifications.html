<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>Notifications · YATRIO"><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f9;color:#173247;font-family:Arial,sans-serif}.top{background:#102a43;color:#fff;padding:17px max(18px,calc((100% - 920px)/2));display:flex;justify-content:space-between;align-items:center}.top a{color:#d8efeb;text-decoration:none}.brand{font-weight:900;font-size:22px}.wrap{max-width:920px;margin:32px auto;padding:0 18px}.hero{background:linear-gradient(110deg,#102a43,#176d70);color:white;padding:26px;border-radius:18px}.hero small{letter-spacing:2px;color:#a9e8df;font-weight:bold}.hero h1{font-size:28px;margin:9px 0}.hero p{font-size:13px;line-height:1.6;color:#e0eeee;margin:0}.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0}.count{font-size:13px;color:#637988}.btn{border:0;background:#18a999;color:white;font-weight:bold;padding:10px 14px;border-radius:9px;cursor:pointer}.list{display:grid;gap:12px}.item{background:white;border:1px solid #e2ebef;border-radius:14px;padding:17px;display:grid;grid-template-columns:9px 1fr auto;gap:13px;align-items:start}.dot{width:9px;height:9px;border-radius:50%;background:#18a999;margin-top:6px}.item.read .dot{background:#cbd5dc}.item h2{font-size:15px;margin:0 0 6px}.item p{font-size:12px;color:#687d8a;line-height:1.6;margin:0}.meta{font-size:10px;color:#8798a2;margin-top:9px}.state{font-size:10px;color:#168477;font-weight:bold}.empty{background:white;border:1px dashed #cfdae0;border-radius:14px;padding:30px;text-align:center;color:#728591;font-size:13px;line-height:1.7}@media(max-width:550px){.wrap{margin:20px auto}.hero{padding:21px}.item{grid-template-columns:9px 1fr}.item .state{grid-column:2}.tools{align-items:flex-start;flex-direction:column}} </style></head><body><header class="top"><div class="brand">YATRIO</div><a href="/traveller-dashboard.html">← Dashboard</a></header><main class="wrap"><section class="hero"><small>YOUR TRAVEL UPDATES</small><h1>Notifications</h1><p>Booking requests, provider decisions and verified payment updates in one place.</p></section><div class="tools"><div class="count" id="count">Loading notifications…</div><button class="btn" id="markAll" type="button">Mark all as read</button></div><section class="list" id="list"><div class="empty">Loading your updates…</div></section></main><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>new Date(v).toLocaleString("en-GB",{timeZone:"Asia/Kathmandu",dateStyle:"medium",timeStyle:"short"});
let rows=[];
async function load(){const auth=await window.hatchable.auth.getSession();if(!auth?.user){location.href="/login.html?next="+encodeURIComponent("/traveller-notifications.html");return}const r=await fetch("/api/traveller-notifications");const d=await r.json();if(!r.ok)throw new Error(d.error||"Could not load notifications.");rows=d.notifications||[];document.getElementById("count").textContent=(d.unread_count||0)+" unread · "+rows.length+" total";const root=document.getElementById("list");if(!rows.length){root.innerHTML='<div class="empty">No notifications yet.<br>Booking and payment updates will appear here.</div>';return}root.innerHTML=rows.map(x=>'<article class="item '+(x.is_read?"read":"")+'"><span class="dot"></span><div><h2>'+esc(x.title)+'</h2><p>'+esc(x.message)+'<br>Reference: <b>'+esc(x.booking_ref)+'</b></p><div class="meta">'+esc(fmt(x.created_at))+' · '+esc(x.booking_type.toUpperCase())+'</div></div><div class="state">'+(x.is_read?"READ":"NEW")+'</div></article>').join("")}
document.getElementById("markAll").addEventListener("click",async()=>{const b=document.getElementById("markAll");b.disabled=true;try{const r=await fetch("/api/traveller-notifications",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mark_all:true})});if(!r.ok)throw new Error("Could not update notifications.");await load()}catch(e){document.getElementById("count").textContent=e.message}finally{b.disabled=false}});
load().catch(e=>document.getElementById("list").innerHTML='<div class="empty">'+esc(e.message)+'</div>');
</script></body></html>
