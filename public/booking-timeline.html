<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>Booking timeline · YATRIO</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8f9;color:#183247;font-family:Inter,Arial,sans-serif}.top{background:#102a43;color:#fff;padding:17px max(20px,calc((100% - 820px)/2));display:flex;justify-content:space-between}.top a{color:#cce6e1;text-decoration:none}.wrap{max-width:820px;margin:auto;padding:24px 20px}.muted{color:#6d8190;font-size:13px;line-height:1.6}.event{position:relative;margin:0 0 0 12px;padding:0 0 22px 25px;border-left:2px solid #dcebe8}.event:before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:#18a999;box-shadow:0 0 0 4px #e4f4ef}.event b{font-size:14px}.event p{font-size:12px;color:#708391;line-height:1.6;margin:6px 0}.event small{font-size:10px;color:#8a9aa4}.panel{background:white;border:1px solid #e1eaf0;border-radius:15px;padding:18px}.empty{padding:25px;text-align:center;color:#718391}.btn{display:inline-block;background:#18a999;color:#fff;text-decoration:none;padding:10px 13px;border-radius:9px;font-weight:700;font-size:12px}</style></head><body><header class="top"><b>YATRIO · BOOKING TIMELINE</b><a href="/marketplace-account.html">← My bookings</a></header><main class="wrap"><h1>Booking status timeline</h1><p id="ref" class="muted">Loading booking history…</p><section class="panel"><div id="events"><div class="empty">Loading events…</div></div></section><p><a class="btn" id="messageLink" href="/communications.html">Message provider</a> <a class="btn" href="/support.html">Contact support</a></p></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{const p=new URLSearchParams(location.search),type=p.get('booking_type'),id=p.get('booking_id');if(!['bus','marketplace'].includes(type)||!/^[0-9a-f-]{36}$/i.test(id||'')){$('events').innerHTML='<div class="empty">A valid booking link is required. Open this page from My bookings.</div>';return}const r=await fetch('/api/booking-timeline?booking_type='+type+'&booking_id='+encodeURIComponent(id));const d=await r.json();if(r.status===401){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search);return}if(!r.ok)throw Error(d.error||'Timeline unavailable');$('ref').textContent='Booking '+d.booking.booking_ref+' · '+d.booking.status.replaceAll('_',' ');$('messageLink').href='/communications.html?booking_type='+type+'&booking_id='+id;$('events').innerHTML=d.timeline.map(x=>'<article class="event"><b>'+esc(x.title)+'</b><p>'+esc(x.detail)+'</p><small>'+new Date(x.created_at).toLocaleString()+'</small></article>').join('')||'<div class="empty">No status updates yet.</div>'})().catch(e=>document.getElementById('events').innerHTML='<div class="empty">'+esc(e.message)+'</div>');function $(id){return document.getElementById(id)}
</script></body></html>
