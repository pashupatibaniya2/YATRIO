<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>Saved Trips — YATRIO</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8fa;color:#172b3a;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:28px 20px}header{background:#102a43;color:#fff;padding:18px 0}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#fff}.intro{padding:30px 0}.intro h1{font-size:34px;margin:0 0 8px}.intro p,.trip p{color:#6b7f8d;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.trip,.empty{background:white;border:1px solid #e1eaf0;border-radius:16px;padding:18px}.trip h2{font-size:19px;margin:0 0 8px}.btn{display:inline-block;border:0;border-radius:9px;padding:10px 13px;background:#18a999;color:white;font-weight:700;cursor:pointer;margin:4px 5px 0 0;text-decoration:none}.btn.alt{background:#e8f5f3;color:#147c72}.btn.warn{background:#fff1ef;color:#a83228}.status{font-size:13px;color:#607481;line-height:1.6}.tag{display:inline-block;border-radius:20px;padding:5px 8px;background:#eef7f4;color:#147c72;font-size:11px;font-weight:700}@media(max-width:600px){.top{gap:12px}.intro h1{font-size:28px}}</style></head><body><header><div class="wrap top"><strong>YATRIO · SAVED TRIPS</strong><a href="/plan.html">← Trip planner</a></div></header><main class="wrap"><section class="intro"><h1>Your saved journeys</h1><p>Reopen, share or remove the itineraries saved to your YATRIO account. Shared links can be revoked whenever you choose.</p><div id="status" class="status">Loading your trips…</div></section><section id="trips" class="grid"></section></main><script>
const root=document.getElementById("trips"),statusEl=document.getElementById("status");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){try{const r=await fetch("/api/saved-trips");const d=await r.json();if(r.status===401){statusEl.innerHTML='Sign in to view your private trips. <a href="/login.html?next=%2Fsaved-trips.html">Sign in to YATRIO →</a>';root.innerHTML="";return}if(!r.ok)throw new Error(d.error||"Could not load saved trips.");statusEl.textContent=d.trips.length+" saved trip"+(d.trips.length===1?"":"s");root.innerHTML=d.trips.length?d.trips.map(t=>'<article class="trip" data-id="'+esc(t.id)+'"><h2>'+esc(t.title)+'</h2><p>'+esc(t.origin)+' → '+esc(t.destination)+'<br>'+Number(t.trip_days)+' days · '+esc(t.travel_style)+'<br>Updated '+new Date(t.updated_at).toLocaleDateString()+'</p>'+(t.is_shared?'<span class="tag">Share link active</span>':'<span class="tag">Private</span>')+'<div class="actions"><a class="btn" href="/plan.html?trip='+encodeURIComponent(t.id)+'">Open planner</a><button class="btn alt share" type="button">Create / refresh share link</button>'+(t.is_shared?'<button class="btn warn unshare" type="button">Stop sharing</button>':'')+'<button class="btn alt delete" type="button">Delete</button></div></article>').join(""):'<div class="empty">No saved trips yet. Build an itinerary and choose “Save this trip”.</div>';}catch(e){statusEl.textContent=e.message;root.innerHTML='<div class="empty">Could not load your saved trips. Please refresh and try again.</div>';}}
root.addEventListener("click",async e=>{const card=e.target.closest(".trip");if(!card)return;const id=card.dataset.id;if(e.target.closest(".delete")){if(!confirm("Delete this saved trip? Its share link will stop working."))return;const r=await fetch("/api/saved-trips?id="+encodeURIComponent(id),{method:"DELETE"});if(r.ok)load();else alert("Could not delete this trip.");}if(e.target.closest(".unshare")){if(!confirm("Stop sharing this trip? Existing share links will stop working."))return;const r=await fetch("/api/saved-trips-share?id="+encodeURIComponent(id),{method:"DELETE"});const d=await r.json();if(!r.ok){alert(d.error||"Could not revoke share link.");return;}load();}if(e.target.closest(".share")){const r=await fetch("/api/saved-trips-share",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});const d=await r.json();if(!r.ok){alert(d.error||"Could not create link.");return;}try{await navigator.clipboard.writeText(d.url);e.target.textContent="Link copied!";}catch{prompt("Copy your trip link",d.url);}load();}});
load();
</script></body></html>
