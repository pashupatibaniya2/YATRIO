<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared Nepal itinerary — YATRIO</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8fa;color:#172b3a;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:25px 18px}.hero{background:linear-gradient(120deg,#102a43,#147d7a);color:white;padding:35px;border-radius:18px}.hero h1{font-size:34px;margin:8px 0}.hero p{color:#d4e8e9}.day{background:white;border:1px solid #e1eaf0;border-radius:13px;padding:17px;margin:12px 0}.day h3{margin:0 0 8px}.muted{color:#6b7f8d;font-size:13px;line-height:1.6}.btn{display:inline-block;background:#18a999;color:white;padding:12px 16px;border-radius:9px;text-decoration:none;font-weight:700}</style></head><body><main class="wrap"><section id="content"><p>Loading shared itinerary…</p></section></main><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async()=>{const token=new URLSearchParams(location.search).get("token")||"",root=document.getElementById("content");try{const r=await fetch("/api/shared-trip?token="+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw new Error(d.error||"Trip unavailable.");const t=d.trip;root.innerHTML='<section class="hero"><small>SHARED NEPAL ITINERARY · YATRIO</small><h1>'+esc(t.title)+'</h1><p>'+esc(t.origin)+' → '+esc(t.destination)+' · '+t.trip_days+' days · '+esc(t.travel_style)+'</p><a class="btn" href="/plan.html">Plan your own trip</a></section><h2>Day-by-day outline</h2>'+((t.itinerary||[]).map((x,i)=>'<article class="day"><h3>Day '+(i+1)+' · '+esc(x.title)+'</h3><p class="muted">'+esc(x.description)+'</p><small>'+esc(x.note||"")+'</small></article>').join("")||'<p class="muted">No itinerary details were included.</p>')+'<p class="muted">Shared by a YATRIO traveller. Check local details and provider availability before travelling.</p>'; }catch(e){root.innerHTML='<section class="hero"><h1>Trip link unavailable</h1><p>'+esc(e.message)+'</p><a class="btn" href="/plan.html">Explore YATRIO</a></section>';}})();
</script></body></html>
