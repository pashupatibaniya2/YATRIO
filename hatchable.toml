[auth]
enabled = true
providers = ["email"]

[db.tables.operator_users]
read = "own"
write = "own"

[db.tables.operator_documents]
read = "own"
write = "own"

[db.tables.marketplace_providers]
read = "own"
write = "own"

[db.tables.marketplace_listing_images]
read = "own"
write = "own"

[db.tables.bus_fleet_images]
read = "own"
write = "own"

[db.tables.operator_reviews]
read = "own"
write = "own"

[db.tables.marketplace_listings]
read = "public"
write = "own"

[db.tables.marketplace_availability]
read = "public"
write = "public"

[db.tables.marketplace_bookings]
read = "own"
write = "public"

[db.tables.marketplace_provider_bookings]
read = "own"
write = "public"

[db.tables.marketplace_provider_booking_actions]
read = "own"
write = "own"

[db.tables.payment_transactions]
read = "own"
write = "own"

[[cron]]
path = "/api/expire-seat-holds"
schedule = "0 * * * *"

[[secret]]
name = "KHALTI_LIVE_SECRET_KEY"
required = false
description = "Khalti production live secret key. Keep server-side only."

[[secret]]
name = "ESEWA_PRODUCT_CODE"
required = false
description = "eSewa production merchant product code issued to YATRIO."

[[secret]]
name = "ESEWA_SECRET_KEY"
required = false
description = "eSewa production HMAC-SHA256 signing key. Keep server-side only."

[[secret]]
name = "FONEPAY_MERCHANT_CODE"
required = false
description = "Fonepay merchant code issued to YATRIO after online checkout onboarding."

[[secret]]
name = "FONEPAY_SECRET_KEY"
required = false
description = "Fonepay production signing secret issued to YATRIO."

[[secret]]
name = "FONEPAY_GATEWAY_URL"
required = false
description = "Exact production checkout URL supplied by Fonepay for YATRIO merchant integration."