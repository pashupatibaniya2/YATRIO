[auth]
enabled = true
providers = ["email"]

[db.tables.operator_users]
read = "own"
write = "own"

[db.tables.operator_documents]
read = "own"
write = "own"

[db.tables.marketplace_providers]
read = "own"
write = "own"

[db.tables.marketplace_listing_images]
read = "own"
write = "own"

[db.tables.bus_fleet_images]
read = "own"
write = "own"

[db.tables.marketplace_listings]
read = "public"
write = "own"

[db.tables.marketplace_availability]
read = "public"
write = "public"

[db.tables.marketplace_bookings]
read = "own"
write = "public"

[db.tables.marketplace_provider_bookings]
read = "own"
write = "public"

[db.tables.marketplace_provider_booking_actions]
read = "own"
write = "own"

[db.tables.payment_transactions]
read = "own"
write = "own"

[[cron]]
path = "/api/expire-seat-holds"
schedule = "0 * * * *"

[[secret]]
name = "KHALTI_SECRET_KEY"
required = false
description = "Khalti sandbox merchant secret key for YATRIO test checkout. Do not use a live key in this sandbox-only release."