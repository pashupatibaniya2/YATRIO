[auth]
enabled = true
providers = ["email"]

[db.tables.operator_users]
read = "own"
write = "own"

[db.tables.marketplace_providers]
read = "own"
write = "own"

[db.tables.marketplace_listings]
read = "public"
write = "own"

[db.tables.marketplace_availability]
read = "public"
write = "own"

[db.tables.payment_transactions]
read = "own"
write = "own"

[[secret]]
name = "KHALTI_SECRET_KEY"
required = false
description = "Khalti sandbox merchant secret key for YATRIO test checkout. Do not use a live key in this sandbox-only release."